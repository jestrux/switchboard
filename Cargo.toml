[workspace]
resolver = "2"
members = [
    "crates/sb-core",
    "crates/sb-cli",
    "crates/sb-ffi",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sb-core = { path = "crates/sb-core" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
anyhow = "1"
portable-pty = "0.9"
vt100 = "0.16"
notify = "8"
nix = { version = "0.31", features = ["signal", "process", "user"] }
libc = "0.2"
dirs = "7"
clap = { version = "4", features = ["derive", "env"] }
owo-colors = "4"
crossterm = "0.29"
tempfile = "3"
uniffi = "0.32"
chrono = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
