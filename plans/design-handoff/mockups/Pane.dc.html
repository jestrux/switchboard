<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pane component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; position: relative; display: flex; flex-direction: column; background: {{c.term}}; color: {{c.text}}; font-family: Geist, -apple-system, sans-serif; font-size: 13px; overflow: hidden; box-sizing: border-box">
<div style="height: 36px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; background: {{barBg}}; border-bottom: 1px solid {{c.line}}; box-shadow: {{barRule}}; color: {{barText}}">
<svg width="12" height="12" viewBox="0 0 18 18" aria-hidden="true" style="flex: none; overflow: visible; filter: {{g.glow}}">
<sc-if value="{{g.isRun}}" hint-placeholder-val="{{ true }}"><circle cx="9" cy="9" r="8.5" fill="{{g.c}}" opacity="0.22"></circle><circle cx="9" cy="9" r="4.5" fill="{{g.c}}"></circle></sc-if>
<sc-if value="{{g.isStop}}" hint-placeholder-val="{{ false }}"><circle cx="9" cy="9" r="5" fill="none" stroke="{{g.c}}" stroke-width="2"></circle></sc-if>
<sc-if value="{{g.isStart}}" hint-placeholder-val="{{ false }}"><circle cx="9" cy="9" r="5.5" fill="none" stroke="{{c.amberSoft}}" stroke-width="2"></circle><path d="M9 3.5 A5.5 5.5 0 0 1 14.5 9" fill="none" stroke="{{g.c}}" stroke-width="2" stroke-linecap="round"></path></sc-if>
<sc-if value="{{g.isDone}}" hint-placeholder-val="{{ false }}"><circle cx="9" cy="9" r="6.5" fill="none" stroke="{{c.ring}}" stroke-width="1.6"></circle><path d="M6.3 9.2 L8.2 11 L11.8 7.2" fill="none" stroke="{{g.c}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></sc-if>
<sc-if value="{{g.isCrash}}" hint-placeholder-val="{{ false }}"><circle cx="9" cy="9" r="7.5" fill="none" stroke="{{c.redSoft}}" stroke-width="2"></circle><path d="M9 1.5 A7.5 7.5 0 0 1 15.5 12.75" fill="none" stroke="{{g.c}}" stroke-width="2" stroke-linecap="round"></path><circle cx="9" cy="9" r="3.5" fill="{{g.c}}"></circle></sc-if>
<sc-if value="{{g.isErr}}" hint-placeholder-val="{{ false }}"><path d="M9 2 L16.5 15.5 H1.5 Z" fill="{{g.c}}"></path></sc-if>
<sc-if value="{{g.isEmpty}}" hint-placeholder-val="{{ false }}"><rect x="3" y="3" width="12" height="12" rx="3" fill="none" stroke="{{c.t3}}" stroke-width="1.6" stroke-dasharray="3 2"></rect></sc-if>
</svg>
<sc-if value="{{showAvatar}}" hint-placeholder-val="{{ false }}"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{p.avBg}}; color: {{p.avFg}}; font-size: {{p.avSize}}px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">{{p.av}}</span></sc-if>
<button style="height: 26px; padding: 0 6px; margin-left: -4px; border-radius: 6px; border: 0; background: transparent; color: inherit; font-family: inherit; font-size: 13px; display: flex; align-items: center; gap: 5px; min-width: 0; cursor: pointer" aria-label="Choose command for this pane">
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="color: {{c.t3}}">{{groupText}}</span><span style="font-weight: 600">{{nameText}}</span></span>
<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true" style="flex: none; opacity: 0.6"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg>
</button>
<sc-if value="{{showApply}}" hint-placeholder-val="{{ false }}"><span style="height: 20px; padding: 0 7px; border-radius: 10px; background: {{c.accSoft}}; color: {{c.accSoftText}}; font-size: 11px; font-weight: 600; display: flex; align-items: center; white-space: nowrap; flex: none">{{applyText}}</span></sc-if>
<sc-if value="{{showStatus}}" hint-placeholder-val="{{ true }}"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{statusColor}}; white-space: nowrap; flex: none">{{statusText}}</span></sc-if>
<sc-if value="{{showMax}}" hint-placeholder-val="{{ false }}"><span title="Maximized: ⌘⇧↩ restores the split" style="height: 20px; padding: 0 7px; border-radius: 10px; border: 1px solid {{c.btnLine}}; color: {{c.t2}}; font-size: 11px; display: flex; align-items: center; gap: 5px; white-space: nowrap; flex: none"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M7 1h4v4M5 11H1V7M11 1L7 5M1 11l4-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg>{{maxText}}</span></sc-if>
<span style="flex: 1; min-width: 4px"></span>
<sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
<button aria-label="{{a.label}}" title="{{a.tip}}" style="width: 26px; height: 26px; border-radius: 6px; border: 0; background: {{a.bg}}; color: {{a.fg}}; opacity: {{a.op}}; display: flex; align-items: center; justify-content: center; padding: 0; flex: none">
<sc-if value="{{a.isStop}}" hint-placeholder-val="{{ false }}"><svg width="9" height="9" viewBox="0 0 8 8" aria-hidden="true"><rect width="8" height="8" rx="1.5" fill="currentColor"></rect></svg></sc-if>
<sc-if value="{{a.isPlay}}" hint-placeholder-val="{{ false }}"><svg width="9" height="10" viewBox="0 0 8 9" aria-hidden="true"><path d="M0 0l8 4.5L0 9z" fill="currentColor"></path></svg></sc-if>
<sc-if value="{{a.isRestart}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M10 6a4 4 0 1 1-1.2-2.9M10 1.5v2.6H7.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg></sc-if>
<sc-if value="{{a.isSplit}}" hint-placeholder-val="{{ false }}"><svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><rect x="0.75" y="0.75" width="12.5" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"></rect><path d="M7 1v10" stroke="currentColor" stroke-width="1.3"></path></svg></sc-if>
<sc-if value="{{a.isMax}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M7 1h4v4M5 11H1V7M11 1L7 5M1 11l4-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg></sc-if>
<sc-if value="{{a.isClose}}" hint-placeholder-val="{{ false }}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg></sc-if>
<sc-if value="{{a.isMore}}" hint-placeholder-val="{{ false }}"><svg width="13" height="4" viewBox="0 0 14 4" aria-hidden="true"><circle cx="2" cy="2" r="1.5" fill="currentColor"></circle><circle cx="7" cy="2" r="1.5" fill="currentColor"></circle><circle cx="12" cy="2" r="1.5" fill="currentColor"></circle></svg></sc-if>
</button>
</sc-for>
</div>
<sc-if value="{{backoff}}" hint-placeholder-val="{{ false }}"><div style="height: 2px; flex: none; background: {{c.redSoft}}"><div style="width: 47%; height: 2px; background: {{c.red}}"></div></div></sc-if>

<sc-if value="{{isTerm}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; min-height: 0; padding: 10px 14px; font-family: 'Geist Mono', monospace; font-size: 12.5px; line-height: 1.7; color: {{c.tText}}; overflow: hidden">
<sc-for list="{{lines}}" as="ln" hint-placeholder-count="5">
<sc-if value="{{ln.sep}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 8px; color: {{ln.color}}; font-size: 11px"><span style="white-space: nowrap">{{ln.text}}</span><span style="flex: 1; height: 1px; background: {{ln.lineColor}}"></span></div></sc-if>
<sc-if value="{{ln.isText}}" hint-placeholder-val="{{ true }}"><div style="white-space: pre; overflow: hidden"><sc-for list="{{ln.parts}}" as="pt" hint-placeholder-count="2"><span style="color: {{pt.c}}; font-weight: {{pt.w}}">{{pt.t}}</span></sc-for></div></sc-if>
</sc-for>
<sc-if value="{{cursor}}" hint-placeholder-val="{{ true }}"><div style="width: 8px; height: 15px; margin-top: 2px; background: {{cursorFill}}; border: 1.5px solid {{c.acc}}; box-sizing: border-box"></div></sc-if>
<sc-if value="{{idleNote}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 9px; border: 1px solid {{c.line}}; background: {{c.pane}}; font-family: Geist, sans-serif">
<span style="font-family: 'Geist Mono', monospace; font-size: 12.5px; color: {{c.text}}"><span style="color: {{c.t3}}">$ </span>{{p.run}}</span>
<span style="flex: 1"></span>
<span style="font-size: 11.5px; color: {{c.t3}}">never run</span>
<button style="height: 26px; padding: 0 10px; border-radius: 7px; border: 0; background: {{c.acc}}; color: {{c.onAcc}}; font-family: inherit; font-size: 12px; font-weight: 600">Start</button>
</div>
</sc-if>
<sc-if value="{{errNote}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 9px; border: 1px solid {{c.orange}}; background: {{c.orangeSoft}}; font-family: Geist, sans-serif">
<span style="font-size: 12.5px; font-weight: 600; color: {{c.text}}">Folder not found</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: {{c.orange}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.folder}}</span>
<span style="font-size: 12px; color: {{c.accSoftText}}; font-weight: 500">Edit Config ⌘E</span>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: {{c.pane}}">
<div style="width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 600">Show a command</div>
<div style="height: 32px; border-radius: 8px; border: 1px solid {{c.acc}}; background: {{c.term}}; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: {{c.t3}}; box-shadow: 0 0 0 3px {{c.accSoft}}; white-space: nowrap; overflow: hidden">
<svg width="12" height="12" viewBox="0 0 13 13" aria-hidden="true" style="flex: none"><circle cx="5.5" cy="5.5" r="4" fill="none" stroke="currentColor" stroke-width="1.4"></circle><path d="M8.6 8.6l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>Filter CityBuild
</div>
<div style="display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{picks}}" as="k" hint-placeholder-count="5">
<div style="height: 28px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 6px; background: {{k.bg}}; color: {{k.fg}}">
<span style="width: 8px; height: 8px; border-radius: 4px; box-sizing: border-box; background: {{k.dotFill}}; border: 1.5px solid {{k.dot}}; flex: none"></span>
<span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="color: {{c.t3}}">{{k.group}}</span>{{k.name}}</span>
<span style="font-size: 11px; color: {{c.t3}}; white-space: nowrap">{{k.meta}}</span>
</div>
</sc-for>
</div>
<sc-if value="{{showDragHint}}" hint-placeholder-val="{{ true }}"><div style="font-size: 11.5px; color: {{c.t3}}">↩ to show · or drag a command from the sidebar</div></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{isElsewhere}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: {{c.term}}">
<div style="display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: {{c.t3}}; text-align: center">
<svg width="15" height="12" viewBox="0 0 22 18" aria-hidden="true"><rect x="1" y="1" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect><path d="M8 7h13v10H8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
<span>Showing in {{where}}</span>
<button style="height: 26px; padding: 0 10px; border-radius: 7px; border: 1px solid {{c.btnLine}}; background: transparent; color: {{c.t2}}; font-family: inherit; font-size: 12px">Show Here</button>
</div>
</div>
</sc-if>

<sc-if value="{{showFoot}}" hint-placeholder-val="{{ true }}">
<div style="height: 22px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: {{c.head}}; border-top: 1px solid {{c.line}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; color: {{c.t3}}; white-space: nowrap; overflow: hidden">
<sc-for list="{{foot}}" as="f" hint-placeholder-count="3"><span>{{f.k}} <span style="color: {{f.vc}}">{{f.v}}</span></span></sc-for>
</div>
</sc-if>
</div>
</x-dc>
