<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board</title>
<!--
  Flex Review: the board an agent sends the author to whenever there's something to look at or decide.
  One static file. It renders window.FLEX_REVIEW from data.js (written by `flex review`), re-reads it every 3 s,
  and keeps the author's answers in localStorage, keyed by project.dir. The design is in DESIGN.md next to it.
-->
<style>
:root{
  --bg:#0A0A0C;--rail:#0E0E11;--surface:#131317;--raised:#1A1A1F;--hover:#1E1E24;--line:#26262D;--line-2:#2E2E36;
  --ink:#F2F1EC;--ink-2:#B3B2BC;--ink-3:#8B8A95;--wave:#4A4A55;--media:#000;
  --accent:#D5FC31;--accent-line:#D5FC31;--accent-soft:rgba(213,252,49,.09);--on-accent:#12140A;--btn-bg:#D5FC31;--btn-ink:#12140A;
  --time:#B8A6FF;--time-soft:rgba(184,166,255,.14);--ok:#5FD99A;--warn:#FFB547;--warn-soft:rgba(255,181,71,.08);--warn-line:rgba(255,181,71,.38);--bad:#FF6B6B;
  --glow:rgba(213,252,49,.16);--skel-a:#17171C;--skel-b:#202027;
  --m-fast:120ms cubic-bezier(.2,0,0,1);--m-base:220ms cubic-bezier(.2,0,0,1);--m-drawer:260ms cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F5F5F2;--rail:#EDEDEA;--surface:#FFFFFF;--raised:#FAFAF8;--hover:#F0F0EC;--line:#E0DFDA;--line-2:#D6D5CF;
  --ink:#141417;--ink-2:#4F4E57;--ink-3:#6A6973;--wave:#B9B8B2;--media:#0A0A0C;
  --accent-line:#5F7A00;--accent-soft:rgba(140,180,0,.12);--btn-bg:#141417;--btn-ink:#D5FC31;
  --time:#5A3FD0;--time-soft:rgba(90,63,208,.10);--ok:#13804A;--warn:#A85D00;--warn-soft:rgba(168,93,0,.07);--warn-line:rgba(168,93,0,.35);--bad:#C4302B;
  --glow:rgba(140,180,0,.18);--skel-a:#ECEBE7;--skel-b:#F4F3EF;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F5F5F2;--rail:#EDEDEA;--surface:#FFFFFF;--raised:#FAFAF8;--hover:#F0F0EC;--line:#E0DFDA;--line-2:#D6D5CF;
  --ink:#141417;--ink-2:#4F4E57;--ink-3:#6A6973;--wave:#B9B8B2;--media:#0A0A0C;
  --accent-line:#5F7A00;--accent-soft:rgba(140,180,0,.12);--btn-bg:#141417;--btn-ink:#D5FC31;
  --time:#5A3FD0;--time-soft:rgba(90,63,208,.10);--ok:#13804A;--warn:#A85D00;--warn-soft:rgba(168,93,0,.07);--warn-line:rgba(168,93,0,.35);--bad:#C4302B;
  --glow:rgba(140,180,0,.18);--skel-a:#ECEBE7;--skel-b:#F4F3EF;color-scheme:light}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:21px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
input,textarea{font-family:inherit;color:var(--ink)}
a{color:var(--ink-2)}a:hover{color:var(--ink)}
code{font-family:var(--mono);font-size:.9em;padding:0 3px;border-radius:4px;background:var(--hover)}
b,strong{font-weight:650}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)!important;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kbd{font-family:var(--mono);font-size:11px;line-height:16px;min-width:18px;padding:0 4px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-3);text-align:center;display:inline-block;font-weight:400}
.kbd.cur{border-color:currentColor;color:inherit;opacity:.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ib{transition:background var(--m-fast),color var(--m-fast)}
.ib:hover{background:var(--hover);color:var(--ink)}
.row{transition:background var(--m-fast)}
.row:hover{background:var(--hover)}
svg{flex:0 0 auto}

/* ── app frame ── */
#app{height:100vh;display:flex;min-width:1100px}
.rail{flex:0 0 232px;width:232px;min-width:0;display:flex;flex-direction:column;background:var(--rail);border-right:1px solid var(--line);min-height:0;overflow:auto}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 16px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.iconbtn{width:28px;height:28px;border-radius:6px;color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.proj{display:flex;gap:10px;align-items:center;margin:4px 12px 14px;padding:10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.proj-poster{flex:0 0 27px;height:48px;border-radius:3px;background:linear-gradient(180deg,#151a2e,#2a1430 55%,#3b1840);background-size:cover;background-position:center}
.proj-poster.wide{flex-basis:48px;height:27px}
.proj-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-meta{font-size:11px;line-height:15px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav-a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:var(--ink-2);font-size:13px;text-align:left;width:100%}
.nav-a.on{background:var(--hover);color:var(--ink);font-weight:600}
.nav-a .grow{flex:1}
.badge-count{font-family:var(--mono);font-size:11px;font-weight:700;line-height:18px;padding:0 6px;border-radius:9px;background:var(--accent);color:var(--on-accent)}
.rail-sec{display:flex;align-items:baseline;justify-content:space-between;padding:22px 16px 8px}
.rail-sec b{font-size:12px;font-weight:600;color:var(--ink-3)}
.rail-sec span{font-size:11px;color:var(--ink-3)}
.journey{list-style:none;margin:0;padding:0 8px;position:relative;display:flex;flex-direction:column;gap:1px}
.journey:before{content:"";position:absolute;left:22px;top:16px;bottom:16px;width:1.5px;background:var(--line-2)}
.jrow{position:relative;display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;font-size:13px;width:100%;text-align:left;color:var(--ink)}
.jrow.done{color:var(--ink-3)}
.jrow.on{background:var(--hover);color:var(--ink);font-weight:600}
.jmark{width:14px;height:14px;display:flex;align-items:center;justify-content:center;background:var(--rail);border-radius:7px}
.ring{display:inline-block;flex:0 0 12px;width:12px;height:12px;border-radius:6px;border:2px solid var(--accent-line)}
.ring.see{border:1.5px dashed var(--ink-3)}
.rail-foot{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:4px;background:var(--ok);box-shadow:0 0 0 3px rgba(95,217,154,.15)}
.dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(255,181,71,.15)}
.rail-note{font-size:12px;line-height:17px;color:var(--ink-3)}
.spin{width:12px;height:12px;border-radius:6px;border:2px solid var(--line-2);border-top-color:var(--ink-2);animation:spin 900ms linear infinite;display:inline-block;flex:0 0 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── inbox list ── */
.list{flex:0 0 340px;width:340px;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);min-height:0}
.list-head{padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.list-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.h-list{margin:0;font-size:18px;line-height:24px;font-weight:650;letter-spacing:-.01em}
.muted{font-size:12px;color:var(--ink-3)}
.btn{height:32px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.sm{height:28px;padding:0 8px;border-radius:6px;border-color:var(--line);background:transparent;color:var(--ink-2);font-weight:400}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-3);font-weight:400}
.btn-send{height:32px;padding:0 6px 0 14px;border-radius:7px;background:var(--btn-bg);color:var(--btn-ink);font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.btn-send .n{font-family:var(--mono);font-size:11px;line-height:20px;min-width:20px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.18);text-align:center}
.btn-primary{height:40px;padding:0 16px;border-radius:8px;background:var(--btn-bg);color:var(--btn-ink);font-size:13px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:13px;outline:none}
.search:focus-within{border-color:var(--line-2)}
.seg{display:flex;padding:2px;border-radius:7px;background:var(--surface);border:1px solid var(--line)}
.seg button{height:24px;padding:0 9px;border-radius:5px;color:var(--ink-3);font-size:12px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--ink);font-weight:600}
.seg.dark{background:rgba(255,255,255,.06);border:0}
.seg.dark button{height:26px;padding:0 10px;color:#9a99a4;display:inline-flex;align-items:center;gap:6px}
.seg.dark button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:#f2f1ec}
.tagsmenu{position:absolute;right:0;top:34px;z-index:20;min-width:200px;max-height:320px;overflow:auto;padding:6px;border-radius:8px;background:var(--raised);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tagsmenu label{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:5px;font-size:13px;cursor:pointer}
.tagsmenu label:hover{background:var(--hover)}
.list-body{flex:1;overflow:auto;padding:6px 8px 16px}
.grp{display:flex;flex-direction:column;gap:1px;padding-top:10px}
.grp-h{display:flex;align-items:center;gap:8px;padding:2px 8px 6px;font-size:12px;color:var(--ink-3)}
.grp-h b{font-weight:600;color:var(--ink-2)}
.irow{width:100%;display:flex;align-items:flex-start;gap:10px;padding:8px 8px 8px 10px;border-radius:7px;text-align:left}
.irow.on{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line-2)}
.irow .ring,.irow .chk{margin-top:4px}
.irow-t{font-size:13px;line-height:19px;font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow.done .irow-t{color:var(--ink-3);font-weight:400}
.irow-s{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--ink-3);min-width:0}
.irow-s span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;line-height:16px;padding:0 6px;border-radius:8px;white-space:nowrap}
.pill.new{border:1px solid var(--accent-line);color:var(--accent-line);padding:0 5px}
.pill.unsure{background:rgba(255,181,71,.12);color:var(--warn);padding:0 6px 0 4px}
.pill.block{background:color-mix(in oklab,var(--bad) 14%,transparent);color:var(--bad);padding:0 6px}
.pill.rec{border:1px solid var(--line-2);color:var(--ink-2);font-weight:400}
.pill.v{background:var(--time-soft);color:var(--time);font-family:var(--mono);font-weight:400}
.pill.way{background:var(--time-soft);color:var(--time);font-weight:500}
.pill.ev{border:1px solid var(--line-2);color:var(--ok);font-weight:400;font-size:11px;line-height:18px;padding:0 7px;border-radius:9px}
.pill.taste{border:1px solid var(--line-2);color:var(--ink-3);font-weight:400;font-size:11px;line-height:18px;padding:0 7px;border-radius:9px}
.glow{animation:glow 2.4s ease-out 1}
@keyframes glow{0%{background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent-line),0 0 28px var(--glow)}100%{box-shadow:0 0 0 1px transparent,0 0 0 transparent}}
.arrive{animation:arrive 320ms cubic-bezier(.2,0,0,1) 1}
@keyframes arrive{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ── main ── */
.main{flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 16px 0 24px;border-bottom:1px solid var(--line);min-width:0}
.crumb{font-size:13px;color:var(--ink-3);white-space:nowrap}
.crumb-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.sq{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.vsep{width:1px;height:20px;background:var(--line);margin:0 6px}
.stagelink{height:30px;padding:0 10px 0 6px;border-radius:6px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.scroll{flex:1;overflow:auto;min-height:0}
.bar-warn{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--warn-soft);border-bottom:1px solid var(--warn-line);font-size:13px}
.bar-wait{display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)}

/* ── reading pane ── */
.read{display:flex;flex-wrap:wrap;gap:32px;padding:28px 32px 48px;align-items:flex-start;max-width:1240px}
.read.horiz{flex-direction:column;flex-wrap:nowrap;gap:24px}
.read-media{flex:0 0 340px;display:flex;flex-direction:column;gap:10px;min-width:0}
.read.horiz .read-media{flex:none;width:100%;max-width:960px}
.read-col{flex:1 1 320px;min-width:300px;max-width:600px;display:flex;flex-direction:column;gap:24px}
.read.horiz .read-col{max-width:720px;width:100%}
.read.nomedia .read-col{max-width:720px}
.h-read{margin:0;font-size:24px;line-height:30px;font-weight:650;letter-spacing:-.02em}
.head-col{display:flex;flex-direction:column;gap:6px}
.sub{font-size:13px;color:var(--ink-3)}
.summary{font-size:14px;line-height:21px;color:var(--ink-2);margin:0}
.prose{font-size:15px;line-height:25px;max-width:62ch;margin:0;color:var(--ink)}
.step-doc p{margin:0 0 12px}.step-doc ul{margin:4px 0 16px;padding-left:20px}.step-doc li{margin:3px 0}
.step-doc li:has(> input[type=checkbox]){list-style:none;margin-left:-20px}.step-doc input[type=checkbox]{margin:0 8px 0 0;accent-color:var(--accent);vertical-align:-2px}
.step-doc code{font:12.5px var(--mono);background:var(--hover);padding:1px 5px;border-radius:4px}.step-doc a{color:inherit}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;line-height:18px;padding:0 7px;border-radius:9px;color:var(--ink-3);border:1px solid var(--line)}
.meta{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.meta .btn{margin-left:auto}

/* ── stacked (stage / everything) ── */
.stack{padding:28px 32px 64px;display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
.stage-h{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.h-stage{margin:0;font-size:24px;line-height:30px;font-weight:650;letter-spacing:-.02em}
.h-sub{margin:0;font-size:18px;line-height:24px;font-weight:650}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;scroll-margin-top:16px}
.card.focus{border-color:var(--line-2);box-shadow:0 0 0 1px var(--line-2)}
.card-in{display:flex;flex-wrap:wrap;gap:28px;padding:20px;align-items:flex-start}
.card-in.horiz{flex-direction:column;flex-wrap:nowrap;gap:20px}
.card-in .read-media{flex-basis:300px}
.card-in.horiz .read-media{width:100%;max-width:none}
.card-in .read-col{max-width:640px;gap:20px}
.card-in.horiz .read-col{max-width:760px}
.card .h-read{font-size:18px;line-height:24px}
.card-row{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:13px;width:100%;text-align:left}
.card-row .t{flex:0 1 auto;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-row .a{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skel{display:block;border-radius:4px;background:linear-gradient(90deg,var(--skel-a),var(--skel-b),var(--skel-a));background-size:200% 100%;animation:skel 1.4s linear infinite}
@keyframes skel{from{background-position:200% 0}to{background-position:0 0}}
.working-card{border:1px dashed var(--line-2);border-radius:12px;padding:18px;display:flex;gap:18px}
.settled{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.settled-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.settled-h b{color:var(--ink-2);font-weight:600}
.srow{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow-top{display:flex;align-items:center;gap:10px;font-size:13px;line-height:19px}
.srow-top .txt{flex:1;color:var(--ink-2)}
.objected{font-size:11px;font-weight:600;color:var(--warn)}
.progress{display:grid;gap:4px}
.progress span{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;position:relative}
.progress span i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-line)}

/* ── body kinds ── */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.card .checks{background:var(--bg)}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;line-height:19px}
.checks li:last-child{border-bottom:0}
.checks svg{margin-top:2px}
.beats{display:grid;grid-template-columns:72px minmax(120px,180px) 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.card .beats{background:var(--bg)}
.beats>div{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;line-height:19px}
.beats>div.last{border-bottom:0}
.beats .at{font-family:var(--mono);color:var(--time);font-size:12px}
.beats .bt{font-weight:600}
.beats .bx{color:var(--ink-2)}
.fields{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.card .field{background:var(--bg)}
.field-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.field-h b{color:var(--ink-2);font-weight:600}
.field pre{margin:0;font-family:var(--mono);font-size:12px;line-height:19px;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.copy{margin-left:auto;height:24px;padding:0 8px;border-radius:5px;border:1px solid var(--line-2);font-size:11px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.copy.ok{color:var(--ok);border-color:var(--ok)}
.result{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;border:1px dashed var(--line-2)}
.result input{flex:1;border:0;background:transparent;font-size:13px;outline:none;min-width:0}
.takes{display:flex;flex-direction:column;gap:12px}
.take{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.card .take{background:var(--bg)}
.take-h{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600}
.take-f{font-size:12px;color:var(--ink-3)}

/* frames & players */
.frame{position:relative;border-radius:8px;background:var(--media);overflow:hidden;width:100%}
.frame img,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.frame.fill img,.frame.fill video{object-fit:cover}
.frame .badge{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff}
.frame .tl{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;line-height:20px;padding:0 7px;border-radius:4px;background:rgba(0,0,0,.6);color:#fff}
.frame .tr{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:11px;line-height:20px;padding:0 7px;border-radius:4px;background:rgba(0,0,0,.6);color:#fff}
.frame .missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.55);text-align:center;padding:12px}
.bigplay{position:absolute;left:50%;top:50%;margin:-28px 0 0 -28px;width:56px;height:56px;border-radius:28px;background:rgba(10,10,12,.55);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity var(--m-fast)}
.playing .bigplay{opacity:0;pointer-events:none}
.frame-tools{display:flex;align-items:center;gap:6px}
.track{position:relative;height:28px;border-radius:4px;background-color:var(--surface);border:1px solid var(--line);cursor:pointer;touch-action:none}
.card .track{background-color:var(--bg)}
.track .fillp{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);pointer-events:none}
.track .ph{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px;pointer-events:none}
.track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2);pointer-events:none}
.track .tick.down{background:var(--wave)}
.track .pin{position:absolute;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:6px 6px 6px 0;transform:rotate(-45deg);background:var(--time);cursor:pointer;z-index:2}
.track .uns{position:absolute;top:0;bottom:0;background:rgba(255,181,71,.18);box-shadow:inset 0 0 0 1px rgba(255,181,71,.5);pointer-events:none}
.secband{position:relative;height:14px;font-size:10px;line-height:14px;color:var(--ink-3)}
.secband span{position:absolute;top:0;border-top:2px solid var(--line-2);overflow:hidden;white-space:nowrap;padding-top:1px}
.ctl{display:flex;align-items:center;gap:4px;padding-top:4px;flex-wrap:wrap}
.ctl .b{width:30px;height:30px;border-radius:6px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.ctl .b.play{color:var(--ink)}
.ctl .t{font-family:var(--mono);font-size:12px}
.ctl .bar{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--time)}
.ctl .spd{height:26px;padding:0 6px;border-radius:5px;color:var(--ink-3);font-family:var(--mono);font-size:11px}
.ctl .tog{height:26px;padding:0 8px;border-radius:5px;font-size:11px;color:var(--ink-3);border:1px solid var(--line)}
.ctl .tog[aria-pressed="true"]{color:var(--ink);border-color:var(--accent-line);background:var(--accent-soft)}
.hints{display:flex;gap:10px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.wave{position:relative;height:64px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;touch-action:none;overflow:hidden}
.card .wave{background:var(--bg)}
.wave canvas{position:absolute;inset:0;width:100%;height:100%}
.audio{display:flex;flex-direction:column;gap:6px}

/* compare */
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp-side{display:flex;gap:12px}
.cmp-side>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cmp-cap{font-size:12px;line-height:17px;color:var(--ink-2)}
.cmp-cap b{font-family:var(--mono);font-weight:700;margin-right:4px}
.cmp-swipe{position:relative}
.cmp-swipe .layer{position:absolute;inset:0}
.cmp-div{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#f2f1ec;pointer-events:none}
.cmp-div span{position:absolute;top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:14px;background:#f2f1ec;display:flex;align-items:center;justify-content:center;color:#0a0a0c}
input[type=range]{accent-color:var(--accent-line)}

/* storyboard */
.sb{display:flex;flex-direction:column}
.sb-ruler{display:flex;flex-direction:column;gap:6px}
.sb-wave{position:relative;height:64px;border-radius:6px;background-color:var(--bg);border:1px solid var(--line);overflow:hidden}
.sb-pins{position:relative;height:30px}
.sb-pin{position:absolute;top:4px;transform:translateX(-50%);min-width:20px;height:20px;padding:0 4px;border-radius:10px;font-size:10px;font-weight:700;line-height:18px;font-family:var(--mono);border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.sb-pin.on{border-color:transparent;background:var(--accent);color:var(--on-accent);z-index:2}
.sb-bars{position:relative;height:14px;font-size:10px;color:var(--ink-3)}
.sb-bars span{position:absolute;transform:translateX(-50%)}
.sb-strip{display:flex;gap:10px;overflow-x:auto;padding:16px 0 18px}
.sb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;padding:16px 0 18px}
.pnl{display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);transition:transform var(--m-fast);min-width:0}
.pnl:hover{transform:translateY(-2px)}
.sb-strip .pnl{flex:0 0 124px}
.pnl .frame{border-radius:6px}
.pnl.on .frame{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent-line)}
.pnl-cap{display:flex;gap:6px;align-items:baseline;font-size:12px;line-height:16px;min-width:0}
.sb-grid .pnl-cap{flex-direction:column;gap:0}
.pnl-cap .b{font-family:var(--mono);color:var(--time);font-weight:600}
.pnl-cap .c{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pnl.on .pnl-cap .c{color:var(--ink)}
.pnl .ndot{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:4px;background:var(--time);box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.sb-insp{display:flex;flex-wrap:wrap;gap:28px;padding:20px;border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 10px 10px}
.sb-box{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sb-top{padding:12px 16px 0}
.dl{margin:0;display:grid;grid-template-columns:120px minmax(0,1fr);row-gap:6px;font-size:13px;line-height:19px}
.dl dt{color:var(--ink-3)}.dl dd{margin:0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}

/* decision & stance */
.dec{display:flex;flex-direction:column;gap:10px}
.stance{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:8px;background:var(--raised);border:1px solid var(--line)}
.stance.unsure{background:var(--warn-soft);border-color:var(--warn-line);gap:8px}
.stance.call{background:transparent;border-style:dashed}
.stance-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.stance-h b{color:var(--ink);font-weight:600}
.stance p{margin:0;font-size:13px;line-height:19px;color:var(--ink-2)}
.lookchip{align-self:flex-start;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--time);background:var(--time-soft);color:var(--time);font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.q{font-size:13px;font-weight:600;color:var(--ink-2)}
.q span{font-weight:400;color:var(--ink-3)}
.opts{display:flex;gap:8px}
.opts.many{flex-direction:column}
.opts.many .opt,.rv .opts .opt{flex:none}
.opt{flex:1;min-height:48px;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px;text-align:left;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:background var(--m-base),box-shadow var(--m-base),color var(--m-base)}
.card .opt{background:var(--bg)}
.opt:hover{background:var(--hover)}
.opt .l{display:flex;align-items:center;gap:10px;min-width:0}
.opt .lt{display:flex;flex-direction:column;min-width:0}
.opt .os{font-size:12px;font-weight:400;color:var(--ink-3);line-height:16px}
.opt .r{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.opt.rec{border-color:transparent;background:var(--btn-bg);color:var(--btn-ink)}
.opt.rec .os{color:inherit;opacity:.7}
.opt.rec:hover{filter:brightness(1.05)}
.opt.lean{border:1px dashed var(--warn-line)}
.opt.lean .leaning{font-size:11px;font-weight:500;color:var(--warn)}
.opt.chosen{border-color:transparent;background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.opt.chosen .os{color:var(--ink-3);opacity:1}
.opt.faded{border-color:var(--line);background:transparent;color:var(--ink-3)}
.opt.faded .os{color:var(--ink-3);opacity:1}
.opt.chip{flex:0 0 auto;min-height:36px;border-radius:18px;font-size:13px;padding:0 14px}
.opts.multi{flex-wrap:wrap}
.thenbox{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:8px;border:1px dashed var(--line-2)}
.thenbox b{font-size:11px;font-weight:600;color:var(--ink-3)}
.thenbox span{font-size:13px;line-height:19px;color:var(--ink-2)}
.outs{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.outs li{font-size:12px;line-height:17px;color:var(--ink-2)}
.outs li.warn{color:var(--warn)}
.handled-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.changed{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:8px;border:1px solid var(--time);background:var(--time-soft)}
.changed-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.changed-btns{display:flex;gap:8px}
.changed-btns button{flex:1;height:40px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}

.outbox{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg)}
.card .outbox{background:var(--surface)}
.outbox.prev{border-style:dashed;background:transparent}
.outbox-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink);padding:0 8px 4px}
.outbox-h svg{color:var(--ink-3)}
.outrow{display:flex;gap:10px;align-items:flex-start;padding:5px 8px;border-radius:6px}
.outrow.warn{background:var(--warn-soft)}
.outrow .oicon{flex:0 0 12px;height:20px;display:flex;align-items:center;justify-content:center}
.outrow .oicon i{width:4px;height:4px;border-radius:2px;background:var(--ink-3)}
.outrow .ot{flex:0 0 88px;font-size:12px;font-weight:600;line-height:20px;color:var(--ink-2)}
.outrow.warn .ot{color:var(--warn)}
.outrow .ox{font-size:13px;line-height:20px;color:var(--ink)}
.thenline{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:18px;color:var(--ink-3)}
.thenline svg{margin-top:3px}
.thenline b{font-weight:600;color:var(--ink-2)}
.owarn{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:7px;border:1.5px solid var(--warn);color:var(--warn);font-size:10px;font-weight:800;line-height:1}
.opt.rec .owarn{border-color:currentColor;color:inherit}
.opt.picked{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent-line)}
.ring.half{background:linear-gradient(90deg,var(--accent-line) 50%,transparent 50%)}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border-radius:10px;border:1.5px dashed var(--line-2);color:var(--ink-2);font-size:13px;cursor:pointer;text-align:center}
.dropzone:hover,.dropzone.over{border-color:var(--accent-line);background:var(--accent-soft)}
.bring{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.card .bring{background:var(--bg)}
.uplist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px}
.uprow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.uprow:last-child{border-bottom:0}
.ab{display:flex;flex-direction:column;gap:10px}
.lane{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);width:100%;color:var(--ink)}
.card .lane{background:var(--bg)}
.lane.on{border-color:transparent;box-shadow:inset 0 0 0 1.5px var(--accent-line);background:var(--accent-soft)}
.lane-id{flex:0 0 22px;height:22px;border-radius:11px;border:1px solid var(--line-2);text-align:center;line-height:20px;font-size:11px;font-weight:700}
.lane.on .lane-id{background:var(--accent);color:var(--on-accent);border-color:transparent}
.oif{height:26px;padding:0 9px 0 7px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-2);font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.oif:hover{background:var(--hover);color:var(--ink)}
.flexline{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2)}
.flexline svg{color:var(--ok)}
.filmcard{display:flex;gap:10px;align-items:center;margin:4px 12px 14px;padding:10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--ink);transition:border-color var(--m-fast),background var(--m-fast)}
.filmcard:hover{border-color:var(--line-2)}
.filmcard.on{border-color:transparent;box-shadow:inset 0 0 0 1.5px var(--accent-line);background:var(--accent-soft)}
.filmcard-poster{position:relative;flex:0 0 34px;height:60px;border-radius:4px;background:#1a1420 center/cover}
.filmcard-poster.wide{flex-basis:60px;height:34px}
.fplay{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:10px;background:rgba(10,10,12,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.fsegs{display:flex;gap:2px;height:4px;margin-top:2px}
.fseg{position:relative;border-radius:2px;background:var(--line-2);overflow:hidden;min-width:2px}
.fseg.built{background:var(--accent-line)}
.fseg.building{background:var(--line-2)}
.fseg.building i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-line);opacity:.55;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.fstrip{position:relative;display:flex;gap:3px;height:14px;cursor:pointer;touch-action:none}
.fseg.big{border-radius:3px}
.fstrip .ph{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px;pointer-events:none}
.fkey{display:inline-flex;align-items:center;gap:5px}
.fkey:before{content:"";width:10px;height:6px;border-radius:2px;background:var(--line-2)}
.fkey.built:before{background:var(--accent-line)}
.fkey.building:before{background:repeating-linear-gradient(90deg,var(--accent-line) 0 3px,var(--line-2) 3px 6px)}
.film-stage{display:flex;justify-content:center;padding:28px 32px 48px}
.film-col{display:flex;flex-direction:column;gap:10px;max-width:100%}
.film-col .filmplayer{align-self:center}
.film-left{display:flex;flex-direction:column;gap:12px;align-items:flex-start;flex:0 0 auto;max-width:min(100%,720px)}
.film-side{flex:1 1 300px;min-width:280px;max-width:440px;display:flex;flex-direction:column;gap:16px}
.filmframe img,.filmframe video{transition:filter var(--m-base)}
.filmframe.is-panel img{filter:grayscale(.85) contrast(.9) brightness(.8)}
.fslate{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.fslate-in{margin:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:rgba(10,10,12,.72);color:#f2f1ec;font-size:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scenes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--surface)}
.srow2{width:100%;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;text-align:left;color:var(--ink)}
.srow2.on{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line-2)}
#notifs{position:fixed;top:14px;right:14px;z-index:90;display:flex;flex-direction:column;gap:8px;width:356px}
.notif{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(242,241,236,.86);color:#141417;backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.12);animation:notifin 420ms cubic-bezier(.2,.9,.25,1.05);width:100%}
:root[data-theme="dark"] .notif,:root:not([data-theme="light"]) .notif{background:rgba(40,40,46,.82);color:#f2f1ec;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.12)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .notif{background:rgba(242,241,236,.86);color:#141417}}
.notif.out{opacity:0;transform:translateX(24px);transition:opacity 240ms,transform 240ms}
@keyframes notifin{from{opacity:0;transform:translateX(40px)}}
.notif-icon{flex:0 0 30px;display:flex}
.notif-thumb{flex:0 0 34px;height:44px;border-radius:5px;background:center/cover}
.customcard{position:relative;width:100%;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--surface)}
.card .customcard{background:var(--bg)}
.custom-tag{position:absolute;right:10px;top:-10px;display:inline-flex;align-items:center;gap:5px;font-size:10px;line-height:18px;padding:0 7px;border-radius:9px;background:var(--bg);border:1px solid var(--line-2);color:var(--ink-3)}
#demo-panel{position:fixed;right:14px;bottom:14px;z-index:85;width:330px;border-radius:12px;background:var(--raised);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.45);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.demo-h{display:flex;align-items:center;gap:8px}
.demo-h b{font-size:12px;font-weight:650}
.demo-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto}
.demo-steps li{display:flex;align-items:flex-start;gap:8px;padding:4px 6px;border-radius:6px;color:var(--ink-2);line-height:16px}
.demo-steps li.done{color:var(--ink-3)}
.demo-steps li.next{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent-line)}
.demo-f{display:flex;gap:6px;align-items:center}
.demo-f button:disabled{opacity:.45}
.actline{display:flex;align-items:center;gap:10px;margin:20px 32px 0;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2);max-width:1176px}
.actline svg{color:var(--ink-3)}
.demo-next{font-size:12px;line-height:17px;padding:6px 8px;border-radius:6px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
/* notes */
.notes{display:flex;flex-direction:column;gap:10px}
.notes-h{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink-2)}
.notes-h span{font-weight:400;font-size:12px;color:var(--ink-3)}
.nrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.card .nrow{background:var(--bg)}
.nrow .txt{flex:1;font-size:13px;line-height:20px;white-space:pre-wrap}
.nrow .st{font-size:11px;color:var(--ink-3);line-height:22px;white-space:nowrap}
.tchip{flex:0 0 auto;height:22px;padding:0 8px;border-radius:11px;background:var(--time-soft);color:var(--time);font-family:var(--mono);font-size:11px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.compose{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface)}
.card .compose{background:var(--bg)}
.compose:focus-within{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.compose textarea{border:0;resize:none;background:transparent;font-size:13px;line-height:20px;outline:none;padding:0;min-height:40px}
.compose-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pinchip{height:24px;padding:0 6px 0 8px;border-radius:12px;border:1px solid var(--time);color:var(--time);font-family:var(--mono);font-size:11px;display:inline-flex;align-items:center;gap:6px}
.pinchip.off{border-style:dashed;color:var(--ink-3);border-color:var(--line-2);padding:0 8px}
.xbtn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:8px;color:var(--ink-3)}
.xbtn:hover{background:var(--hover);color:var(--ink)}

/* states */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:48px 24px;text-align:center;min-height:100%}
.empty-t{font-size:20px;line-height:26px;font-weight:650}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;min-height:40px;padding:0 8px 0 14px;border-radius:20px;background:#f2f1ec;color:#0a0a0c;font-size:13px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:arrive 320ms cubic-bezier(.2,0,0,1)}
.toast button{height:28px;padding:0 10px;border-radius:14px;background:#0a0a0c;color:#f2f1ec;font-size:12px;font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(5,5,7,.62);z-index:40;animation:fade var(--m-base)}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;z-index:41;display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.45);animation:drawer var(--m-drawer)}
@keyframes drawer{from{transform:translateX(100%)}}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.drawer-b{flex:1;overflow:auto;padding:4px 24px 20px;display:flex;flex-direction:column;gap:18px}
.drawer-f{display:flex;flex-direction:column;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}
.ans{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.ans-h{display:flex;align-items:center;gap:8px}
.ans-h .t{flex:1;font-size:13px;color:var(--ink-2);min-width:0}
.ans-a{font-size:14px;font-weight:600}
.ans-n{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:19px}
.ans-n span:last-child{color:var(--ink-2)}
.dstage{display:flex;align-items:baseline;gap:8px;padding:14px 0 2px;font-size:12px;color:var(--ink-3)}
.dstage b{font-weight:600;color:var(--ink-2)}
.box{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.box ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:19px;color:var(--ink-2)}
.dashbox{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px dashed var(--line-2);font-size:13px}
pre.sendtxt{margin:0;padding:14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:11.5px;line-height:18px;color:var(--ink-2);white-space:pre-wrap}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(5,5,7,.92);display:flex;align-items:center;justify-content:center;padding:32px;animation:fade var(--m-base)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.lightbox .cap{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:13px;color:#c9c8d0}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:560px;max-height:80vh;overflow:auto;border-radius:12px;background:var(--bg);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.5);padding:28px 32px;display:flex;flex-direction:column;gap:18px;animation:fade var(--m-base)}
.keys{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;font-size:13px;line-height:20px}
.keys dt{text-align:right}
.keys dd{margin:0;color:var(--ink-2)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;font-size:13px;line-height:20px;color:var(--ink-2)}
.steps li b{color:var(--ink)}
.stepn{flex:0 0 22px;height:22px;border-radius:11px;border:1px solid var(--line-2);text-align:center;line-height:20px;font-size:11px;font-family:var(--mono)}

/* review mode */
.rv{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg)}
.rv-top{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.rv-prog{display:flex;gap:4px}
.rv-prog span{width:36px;height:4px;border-radius:2px;background:var(--line-2)}
.rv-prog span.h{background:var(--accent-line)}
.rv-prog span.c{background:var(--ink)}
.rv-mid{flex:1;min-height:0;display:flex}
.rv-media{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:var(--media);overflow:auto;color:#f2f1ec;--surface:#131317;--bg:#0a0a0c;--line:#26262d;--line-2:#2e2e36;--ink:#f2f1ec;--ink-2:#b3b2bc;--ink-3:#8b8a95;--hover:#1e1e24;--wave:#4a4a55;--accent-line:#d5fc31;--accent-soft:rgba(213,252,49,.09);--time:#b8a6ff;--time-soft:rgba(184,166,255,.14)}
.rv-media>*{max-width:100%;min-width:0}
.rv-media>.sb{width:100%;flex:none}
.rv-media:has(>.sb){justify-content:flex-start}
.sb,.sb-strip{min-width:0}
.rv-media .readbox{width:100%;max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px;color:var(--ink)}
.rv-ans{flex:0 0 440px;display:flex;flex-direction:column;border-right:1px solid var(--line);order:-1;background:var(--bg);min-height:0}
.rv-ans-b{flex:1;overflow:auto;padding:24px 28px;display:flex;flex-direction:column;gap:20px}
.rv-ans-f{display:flex;align-items:center;gap:8px;padding:14px 28px;border-top:1px solid var(--line)}
.rv-keys{height:36px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;gap:18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.rv .opts{flex-direction:column}
.rv .opt{width:100%}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .glow{animation:none}
  .spin{animation:spin 2s linear infinite!important}
}
