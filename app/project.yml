name: Switchboard
options:
  bundleIdPrefix: dev.waky
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    revision: 43ba8130f5fb5305c471e252370099e20231ccdf
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    SUPPORTED_PLATFORMS: macosx
    SDKROOT: macosx
targets:
  Switchboard:
    type: application
    platform: macOS
    sources:
      - path: Switchboard
      - path: Generated
      # The board's card page, shown in a web view in the board pane (plans/06-board.md, B2).
      - path: ../board/card.html
        buildPhase: resources
      # The agent skill, linked into ~/.claude/skills by Install switchboard Command.
      - path: ../skills
        type: folder
        buildPhase: resources
      # The switchboard command (built by scripts/build-core.sh), linked onto the PATH.
      - path: Frameworks/bin/switchboard
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
        attributes: [CodeSignOnCopy]
    dependencies:
      - package: SwiftTerm
      - framework: Frameworks/SwitchboardCore.xcframework
        embed: false
    info:
      path: Switchboard/Info.plist
      properties:
        CFBundleName: Switchboard
        CFBundleDisplayName: Switchboard
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        NSDocumentsFolderUsageDescription: Switchboard runs your dev commands in the folders your projects use.
        NSDesktopFolderUsageDescription: Switchboard runs your dev commands in the folders your projects use.
        NSDownloadsFolderUsageDescription: Switchboard runs your dev commands in the folders your projects use.
        NSRemovableVolumesUsageDescription: Switchboard runs your dev commands in the folders your projects use.
        NSNetworkVolumesUsageDescription: Switchboard runs your dev commands in the folders your projects use.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Project Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.waky.switchboard
        PRODUCT_NAME: Switchboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=500"
        DEAD_CODE_STRIPPING: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
